function delArtwork(id){if(!confirm('Remove artwork from auction?'))return;STORE.artworks=STORE.artworks.filter(x=>x.id!==id);toast('Removed.');render()}

function clearSubmissions(){if(!confirm('Clear all submissions?'))return;STORE.submissions=[];toast('Cleared.');render()}
function exportContent(){
  const json=JSON.stringify({articles:STORE.articles,initiatives:STORE.initiatives,artworks:STORE.artworks},null,2);
  navigator.clipboard.writeText(json).then(()=>toast('JSON copied!')).catch(()=>{const b=document.createElement('a');b.href='data:application/json,'+encodeURIComponent(json);b.download='afc-content.json';b.click();toast('JSON downloaded.')});
}
function exportSubmissions(){
  if(!STORE.submissions.length){toast('No submissions.');return}
  const k=['First_Name','Last_Name','Email','Cell_Number','Art_Field','Education','Years_In_Practice','Timestamp'];
  const csv=[k.join(','),...STORE.submissions.map(s=>k.map(x=>`"${(s[x]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const b=document.createElement('a');b.href='data:text/csv,'+encodeURIComponent(csv);b.download='afc-submissions.csv';b.click();toast('CSV downloaded.');
}
function exportDonations(){
  if(!STORE.donations.length){toast('No donations.');return}
  const k=['type','tier','amount','purpose','name','email','phone','org','date','message','ts'];
  const csv=[k.join(','),...STORE.donations.map(d=>k.map(x=>`"${(d[x]||'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  const b=document.createElement('a');b.href='data:text/csv,'+encodeURIComponent(csv);b.download='afc-donations.csv';b.click();toast('CSV downloaded.');
}

/* ─── BANK DETAIL COPY ─── */
function copyBankDetail(btn, val){
  navigator.clipboard.writeText(val).then(()=>{
    btn.textContent='Copied!';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},2000);
    toast('Copied: '+val);
  }).catch(()=>{
    // Fallback for older browsers
    const ta=document.createElement('textarea');
    ta.value=val; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{document.execCommand('copy');toast('Copied: '+val);}catch(_){}
    document.body.removeChild(ta);
    btn.textContent='Copied!'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},2000);
  });
}

/* ─── PLEDGE FUNCTIONS ─── */
function setPledgeType(t){
  pledgeState.type=t;
  ['once','monthly','annual'].forEach(x=>{
    document.getElementById('ptt-'+x)?.classList.toggle('on',x===t);
  });
}

function setPledgeAmt(a){
  pledgeState.amount=a;
  document.getElementById('pledge-amt-input').value=a;
  document.querySelectorAll('.pamt-btn').forEach(b=>{
    b.classList.toggle('on', parseInt(b.textContent.replace(/\D/g,'').replace(/\s/g,''))===a);
  });
}

function submitPledge(){
  const fn   = document.getElementById('pledge-fn')?.value.trim();
  const ln   = document.getElementById('pledge-ln')?.value.trim();
  const em   = document.getElementById('pledge-em')?.value.trim();
  const ph   = document.getElementById('pledge-ph')?.value.trim();
  const org  = document.getElementById('pledge-org')?.value.trim();
  const date = document.getElementById('pledge-date')?.value;
  const purp = document.getElementById('pledge-purpose')?.value;
  const msg  = document.getElementById('pledge-msg')?.value.trim();
  const amt  = parseFloat(document.getElementById('pledge-amt-input')?.value)||pledgeState.amount;
  const consent=document.getElementById('pledge-consent')?.checked;

  if(!fn||!ln){ toast('Please enter your first name and surname.'); return }
  if(!em){      toast('Please enter your email address.'); return }
  if(!amt||amt<10){ toast('Please enter a valid pledge amount (minimum R 10).'); return }
  if(!date){    toast('Please select an intended payment date.'); return }
  if(!consent){ toast('Please confirm your consent to proceed.'); return }

  // Save to store
  const record = {
    type:pledgeState.type, tier:'pledge', amount:amt,
    purpose:purp||'unrestricted',
    name:fn+' '+ln, email:em, phone:ph, org, date, message:msg,
    ts:new Date().toISOString()
  };
  STORE.donations.push(record);

  // Show success
  const form=document.getElementById('pledge-form-inner');
  const succ=document.getElementById('pledge-success');
  const succMsg=document.getElementById('pledge-success-msg');
  if(form) form.style.display='none';
  if(succ) succ.style.display='block';
  if(succMsg) succMsg.textContent=`Thank you, ${fn}. Your pledge of ${fmtCur(amt)} (${pledgeState.type}) has been received. We will contact you at ${em} within 3 business days with your acknowledgement letter and payment details.`;

  // Animate progress bar if visible
  setTimeout(()=>{
    const bar=document.getElementById('pledge-bar');
    if(bar) bar.classList.add('anim');
  }, 300);

  toast(`Pledge of ${fmtCur(amt)} received — thank you, ${fn}!`, 4000);

  // Try sending to Google Sheets
  if(CFG.SHEET_URL&&CFG.SHEET_URL!=='YOUR_GOOGLE_APPS_SCRIPT_URL'){
    fetch(CFG.SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({...record,form:'pledge'})}).catch(()=>{});
  }
}

function openTierPledge(tierName, tierAmt, rawAmt){
  pledgeState.type='monthly';
  pledgeState.amount=rawAmt;
  document.getElementById('pledge-sec')?.scrollIntoView({behavior:'smooth'});
  setTimeout(()=>{
    setPledgeType('monthly');
    setPledgeAmt(rawAmt);
    toast(`Selected: ${tierName} — ${tierAmt}/month`);
  }, 600);
}

/* ─── ANIMATE PROGRESS BAR ON PAGE LOAD ─── */
function animateProgressBar(){
  const bar=document.getElementById('pledge-bar');
  if(bar) setTimeout(()=>bar.classList.add('anim'), 400);
}
